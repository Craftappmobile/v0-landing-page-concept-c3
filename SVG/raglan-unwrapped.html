<!-- Розгортка реглану зверху. Вставте цей блок у статтю (або в шаблон шорткоду). -->
<div class="raglan-unwrapped" data-back-left="11" data-sleeve-right="11" data-front="23" data-sleeve-left="11" data-back-right="12" data-line="2"></div>

<script>
(function () {
  var COLOR_LINE = '#D85A30', COLOR_PLUS = '#993C1D', COLOR_TEXT = '#2C2C2A',
      COLOR_MUTED = '#5F5E5A', COLOR_FILL = '#F1EFE8', COLOR_MARK = '#0F6E56';

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  function renderRaglan(el) {
    var d = el.dataset;
    var line = +d.line || 2;
    var blocks = [
      { label: '½ спинки', n: +d.backLeft },
      { rl: 1 },
      { label: 'рукав', n: +d.sleeveRight },
      { rl: 2 },
      { label: 'перед', n: +d.front },
      { rl: 3 },
      { label: 'рукав', n: +d.sleeveLeft },
      { rl: 4 },
      { label: '½ спинки', n: +d.backRight }
    ];
    var total = 0;
    blocks.forEach(function (b) { total += b.rl ? line : b.n; });

    var W = 680, X0 = 36, X1 = 644, scale = (X1 - X0) / total;
    var y = 90, h = 100, out = [], x = X0;

    out.push('<svg viewBox="0 0 ' + W + ' 320" width="100%" xmlns="http://www.w3.org/2000/svg" ' +
             'font-family="sans-serif" role="img" aria-label="Розгортка реглану зверху">');
    out.push('<defs><marker id="rgl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">' +
             '<path d="M2 1L8 5L2 9" fill="none" stroke="' + COLOR_MUTED + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>');
    out.push('<text x="340" y="30" text-anchor="middle" font-size="12" fill="' + COLOR_MUTED + '">Напрямок в\'язання ряду</text>');
    out.push('<line x1="' + X0 + '" y1="48" x2="' + X1 + '" y2="48" stroke="' + COLOR_MUTED + '" stroke-width="1" marker-end="url(#rgl-arrow)"/>');

    blocks.forEach(function (b) {
      var w = (b.rl ? line : b.n) * scale, cx = x + w / 2;
      if (b.rl) {
        out.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + COLOR_LINE + '"/>');
        out.push('<text x="' + cx + '" y="78" text-anchor="middle" font-size="12" fill="' + COLOR_PLUS + '">РЛ ' + b.rl + '</text>');
        out.push('<text x="' + (x - 7) + '" y="210" text-anchor="middle" font-size="14" font-weight="500" fill="' + COLOR_PLUS + '">+</text>');
        out.push('<text x="' + (x + w + 7) + '" y="210" text-anchor="middle" font-size="14" font-weight="500" fill="' + COLOR_PLUS + '">+</text>');
      } else {
        out.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + COLOR_FILL + '" stroke="' + COLOR_MUTED + '" stroke-width="1"/>');
        out.push('<text x="' + cx + '" y="132" text-anchor="middle" font-size="12" font-weight="500" fill="' + COLOR_TEXT + '">' + esc(b.label) + '</text>');
        out.push('<text x="' + cx + '" y="152" text-anchor="middle" font-size="12" fill="' + COLOR_MUTED + '">' + b.n + ' п.</text>');
      }
      x += w;
    });

    out.push('<circle cx="' + X0 + '" cy="' + y + '" r="5" fill="' + COLOR_MARK + '"/>');
    out.push('<line x1="' + X0 + '" y1="95" x2="' + X0 + '" y2="232" stroke="' + COLOR_MARK + '" stroke-width="1" stroke-dasharray="3 3"/>');
    out.push('<text x="44" y="240" font-size="12" fill="' + COLOR_MARK + '">Початок кругового ряду (маркер)</text>');
    out.push('<rect x="36" y="268" width="16" height="12" fill="' + COLOR_LINE + '"/>');
    out.push('<text x="60" y="278" font-size="12" fill="' + COLOR_MUTED + '">РЛ — регланна лінія (по ' + line + ' п.)</text>');
    out.push('<text x="36" y="302" font-size="14" font-weight="500" fill="' + COLOR_PLUS + '">+</text>');
    out.push('<text x="50" y="302" font-size="12" fill="' + COLOR_MUTED + '">прибавка з обох боків лінії (8 п. за ряд) · разом ' + total + ' п.</text>');
    out.push('</svg>');
    el.innerHTML = out.join('');
  }

  document.querySelectorAll('.raglan-unwrapped').forEach(renderRaglan);
})();
</script>
